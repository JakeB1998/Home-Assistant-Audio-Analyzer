name: Govee Sendspin Audio Analyzer
version: 0.4.2
slug: govee_audio_analyzer
description: "Advanced Sendspin PCM analysis, MQTT sensors, and 25ms adaptive kick detection and 60s playback logs"
url: https://www.music-assistant.io/player-support/sendspin/
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
options:
  sendspin_server: "ws://homeassistant.local:8927/sendspin"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: "DEBUG"
  kick_sensitivity: 0.55
schema:
  sendspin_server: str
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  log_level: list(INFO|DEBUG|WARNING|ERROR)
  kick_sensitivity: float(0.0,1.0)
